# One-liner:  cp .env.example .env  # fill the 3 required vars
#             docker compose up -d --build
services:
  prometheus:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
    ports:
      # health endpoint only; the bot itself uses Telegram long-polling
      - "127.0.0.1:8080:8080"
    volumes:
      # optional: mount Netscape cookies for YouTube bot-checks, then set
      # YT_COOKIES_FILE=/app/cookies/youtube_cookies.txt
      - ./cookies:/app/cookies:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
